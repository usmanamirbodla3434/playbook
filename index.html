<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usman Amir | Junior DevOps Engineer Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0d1117; --card-bg: #161b22; --border: #30363d; --blue: #58a6ff; --green: #238636; --text-main: #c9d1d9; --text-dim: #8b949e; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text-main); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .portfolio-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 480px; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
        .top-gradient { background: linear-gradient(135deg, #1f6feb 0%, #0d1117 100%); height: 100px; }
        .content { padding: 0 25px 30px; text-align: center; }
        .img-container { margin-top: -60px; margin-bottom: 15px; }
        .profile-img { width: 140px; height: 140px; object-fit: cover; border-radius: 50%; border: 4px solid var(--card-bg); box-shadow: 0 8px 16px rgba(0,0,0,0.4); background: #21262d; }
        .status-tag { display: inline-flex; align-items: center; gap: 8px; background: rgba(35, 134, 54, 0.15); color: #3fb950; padding: 6px 16px; border-radius: 50px; font-size: 13px; font-weight: 600; border: 1px solid rgba(63, 185, 80, 0.3); margin-bottom: 20px; }
        .dot { height: 8px; width: 8px; background-color: #3fb950; border-radius: 50%; display: inline-block; animation: blink 1.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        h1 { margin: 0; font-size: 24px; color: white; }
        .title { color: var(--blue); font-family: 'JetBrains Mono', monospace; font-size: 15px; margin: 8px 0 25px; }
        .skills-section { text-align: left; border-top: 1px solid var(--border); padding-top: 20px; }
        .label { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 15px; display: block; font-weight: bold; }
        .skills-grid { display: flex; flex-wrap: wrap; gap: 8px; }
        .skill-tag { background: #21262d; border: 1px solid var(--border); padding: 6px 12px; border-radius: 6px; font-size: 13px; font-family: 'JetBrains Mono', monospace; }
        .btn-hire { display: block; background: var(--green); color: white; text-decoration: none; padding: 12px; border-radius: 8px; font-weight: 600; margin-top: 30px; text-align: center; }
        .btn-hire:hover { background: #2ea043; }
    </style>
</head>
<body>
    <div class="portfolio-card">
        <div class="top-gradient"></div>
        <div class="content">
            <div class="img-container">
                <img src="https://i.postimg.cc/fLJpN3m0/unnamed.jpg" alt="Usman Amir" class="profile-img">
            </div>
            <div class="status-tag"><span class="dot"></span> Available For Junior DevOps Role</div>
            <h1>Usman Amir</h1>
            <div class="title">~/skills/devops --active</div>
            <div class="skills-section">
                <span class="label">Technical Stack</span>
                <div class="skills-grid">
                    <div class="skill-tag">Linux</div>
                    <div class="skill-tag">Ansible</div>
                    <div class="skill-tag">Docker</div>
                    <div class="skill-tag">Jenkins</div>
                    <div class="skill-tag">Git/GitHub</div>
                    <div class="skill-tag">CI/CD</div>
                    <div class="skill-tag">Bash</div>
                </div>
            </div>
            <a href="https://github.com/usmanamirbodla3434" target="_blank" class="btn-hire">View My GitHub Profile</a>
        </div>
    </div>
</body>
</html>
