<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Junior DevOps Engineer Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d1117;
            --card-bg: #161b22;
            --border: #30363d;
            --blue: #58a6ff;
            --green: #238636;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .portfolio-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 100%;
            max-width: 480px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .top-gradient {
            background: linear-gradient(135deg, #1f6feb 0%, #0d1117 100%);
            height: 100px;
        }

        .content {
            padding: 0 25px 30px;
            text-align: center;
        }

        .img-container {
            margin-top: -60px;
            margin-bottom: 15px;
        }

        .profile-img {
            width: 140px;
            height: 180px;
            object-fit: cover;
            border-radius: 12px;
            border: 4px solid var(--card-bg);
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        }

        .status-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(35, 134, 54, 0.15);
            color: #3fb950;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(63, 185, 80, 0.3);
            margin-bottom: 20px;
        }

        .dot {
            height: 8px;
            width: 8px;
            background-color: #3fb950;
            border-radius: 50%;
            display: inline-block;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        h1 { margin: 0; font-size: 24px; color: white; letter-spacing: -0.5px; }
        .title { color: var(--blue); font-family: 'JetBrains Mono', monospace; font-size: 15px; margin: 8px 0 25px; }

        .skills-section {
            text-align: left;
            border-top: 1px solid var(--border);
            padding-top: 20px;
        }

        .label {
            font-size: 12px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
            margin-bottom: 15px;
            display: block;
        }

        .skills-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .skill-tag {
            background: #21262d;
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-family: 'JetBrains Mono', monospace;
            transition: all 0.2s;
        }

        .skill-tag:hover {
            border-color: var(--blue);
            background: rgba(88, 166, 255, 0.1);
        }

        .footer-action {
            margin-top: 30px;
        }

        .btn-hire {
            display: block;
            background: var(--green);
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            transition: filter 0.2s;
        }

        .btn-hire:hover {
            filter: brightness(1.2);
        }
    </style>
</head>
<body>

    <div class="portfolio-card">
        <div class="top-gradient"></div>
        <div class="content">
            <div class="img-container">
                <img src="Screenshot_20251007_053036~2.jpg" alt="DevOps Candidate" class="profile-img">
            </div>

            <div class="status-tag">
                <span class="dot"></span>
                Available For Junior DevOps Engineer / Intern
            </div>

            <h1>Professional Candidate</h1>
            <div class="title">~/skills/devops --active</div>

            <div class="skills-section">
                <span class="label">Technical Stack</span>
                <div class="skills-grid">
                    <div class="skill-tag">Linux</div>
                    <div class="skill-tag">Bash</div>
                    <div class="skill-tag">Docker</div>
                    <div class="skill-tag">Ansible</div>
                    <div class="skill-tag">Git & GitHub</div>
                    <div class="skill-tag">Jenkins</div>
                    <div class="skill-tag">CI/CD</div>
                </div>
            </div>

            <div class="footer-action">
                <a href="#" class="btn-hire">Contact for Collaboration</a>
            </div>
        </div>
    </div>

</body>
</html>
