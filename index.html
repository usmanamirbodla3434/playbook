<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise App | Deployment Status</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --primary-color: #0052cc; --success-color: #36b37e; }
        body { background-color: #f4f5f7; color: #172b4d; }
        .status-card { border-top: 5px solid var(--primary-color); border-radius: 8px; }
        .badge-deployed { background-color: var(--success-color); color: white; }
        .metadata-section { background: #ebecf0; font-family: 'Courier New', monospace; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card status-card shadow-sm">
                <div class="card-body p-5">
                    <div class="d-flex justify-content-between align-items-center">
                        <h2 class="fw-bold">Application Live</h2>
                        <span class="badge badge-deployed px-3 py-2">HEALTHY</span>
                    </div>
                    
                    <p class="text-muted">This node was provisioned and configured via <strong>Ansible Automation</strong>.</p>
                    
                    <hr>

                    <div class="metadata-section p-3 mt-4 rounded">
                        <h6 class="fw-bold border-bottom pb-2 mb-3">DEPLOYMENT METADATA</h6>
                        <div class="row">
                            <div class="col-6"><strong>Environment:</strong></div>
                            <div class="col-6 text-end text-primary">PROD-WEB-NODE</div>
                            
                            <div class="col-6"><strong>Build ID:</strong></div>
                            <div class="col-6 text-end text-danger">#BUILD_NUMBER#</div>
                            
                            <div class="col-6"><strong>Commit Hash:</strong></div>
                            <div class="col-6 text-end">#GIT_COMMIT#</div>
                            
                            <div class="col-6"><strong>Deployed At:</strong></div>
                            <div class="col-6 text-end">#DEPLOY_DATE#</div>
                        </div>
                    </div>

                    <div class="mt-4 d-grid">
                        <button class="btn btn-outline-dark">System Logs</button>
                    </div>
                </div>
            </div>
            <p class="text-center mt-3 text-muted" style="font-size: 0.8rem;">
                Managed by DevOps Pipeline v3.1 | Powered by Jenkins & Ansible
            </p>
        </div>
    </div>
</div>

</body>
</html>
