<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Production Environment | Live</title>
    <style>
        body { 
            /* Ye image aapko wo black/tech look degi */
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), 
                        url('https://images.unsplash.com/photo-1558494949-ef010cbdcc48?q=80&w=2000'); 
            background-size: cover;
            background-position: center;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #00ff00; /* Terminal Green */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px); /* Glass effect */
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }
        .metadata {
            text-align: left;
            background: rgba(0,0,0,0.5);
            padding: 20px;
            border-radius: 8px;
            color: white;
            font-family: monospace;
            border-left: 4px solid #00ff00;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Application Live</h1>
        <div class="metadata">
            <p>BUILD ID: <span style="color:#00ff00;">#105</span></p>
            <p>ENVIRONMENT: PRODUCTION</p>
            <p>COMMIT: 8a33281</p>
            <p>STATUS: HEALTHY</p>
        </div>
        <p style="color:#888; font-size: 12px; margin-top: 20px;">Powered by Jenkins & Ansible</p>
    </div>
</body>
</html>
